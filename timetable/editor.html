<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乐健体育 · 课表时间占用可视化编辑器</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #e0e7ff;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --radius: 8px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px; line-height: 1.5; }
    .container { max-width: 1200px; margin: 0 auto; }

    header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .header-titles h1 { font-size: 24px; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 8px; }
    .header-titles p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 20px; box-shadow: var(--shadow); }

    .config-bar { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
    .config-item { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
    .config-item input { border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; font-size: 14px; }

    .mode-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: #f1f5f9; padding: 12px; border-radius: 6px; margin-top: 14px; }
    .mode-bar .title { font-size: 13px; font-weight: 600; color: #334155; }
    .mode-btn { border: 1px solid #cbd5e1; background: #fff; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .mode-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .custom-weeks-drawer { margin-top: 10px; padding: 12px; background: #fff; border: 1px dashed #cbd5e1; border-radius: 6px; display: none; }
    .custom-weeks-drawer.open { display: block; }
    .weeks-checkboxes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
    .week-check-label { display: flex; align-items: center; gap: 4px; font-size: 13px; cursor: pointer; }

    /* 表格 */
    .table-container { overflow-x: auto; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    table { width: 100%; border-collapse: collapse; text-align: center; }
    th, td { border: 1px solid var(--border); padding: 10px; vertical-align: middle; }
    th { background: #f8fafc; font-weight: 600; font-size: 14px; color: #334155; }
    th.time-col { width: 220px; }

    /* 时间行配置 */
    .time-slot-inputs { display: flex; align-items: center; justify-content: center; gap: 6px; }
    .time-slot-inputs input { width: 75px; padding: 4px; border: 1px solid var(--border); border-radius: 4px; text-align: center; font-size: 13px; }
    .btn-del-row { color: var(--danger); background: none; border: none; cursor: pointer; font-size: 16px; padding: 0 4px; border-radius: 4px; }
    .btn-del-row:hover { background: #fee2e2; }

    /* 单元格交互 */
    .grid-cell { cursor: pointer; transition: background 0.15s, border-color 0.15s; height: 56px; user-select: none; }
    .grid-cell:hover { background: #f1f5f9; }
    .grid-cell.busy { background: var(--primary-light); border-color: #a5b4fc; }
    .grid-cell.dimmed { opacity: 0.35; }

    .cell-content { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; font-size: 12px; }
    .cell-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-top: 2px; }
    .badge-every { background: #c7d2fe; color: #3730a3; }
    .badge-odd { background: #fef3c7; color: #92400e; }
    .badge-even { background: #d1fae5; color: #065f46; }
    .badge-custom { background: #f3e8ff; color: #6b21a8; }

    /* 底部操作 */
    .table-actions { margin-top: 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { background: #fff; border-color: var(--border); color: var(--text); }
    .btn-outline:hover { background: #f1f5f9; }
    .btn-danger-outline { background: #fff; border-color: #fca5a5; color: var(--danger); }
    .btn-danger-outline:hover { background: #fee2e2; }

    .footer-bar { margin-top: 24px; display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 16px 20px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); flex-wrap: wrap; gap: 14px; }
    .summary-text { font-size: 14px; color: var(--text-muted); }
    .summary-text strong { color: var(--primary); font-size: 16px; }

    /* 通知 Toast */
    #toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 500; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 999; }
    #toast.show { opacity: 1; pointer-events: auto; }
    #toast.success { background: var(--success); }
    #toast.error { background: var(--danger); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-titles">
      <h1>🗓️ 乐健体育 · 课表时间占用编辑器</h1>
      <p>点击网格标记有课时段。抢课脚本将自动避开勾选了的时间，避免选课冲突。</p>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-outline" onclick="loadFromBackend()">🔄 重新加载</button>
      <button class="btn btn-primary" onclick="saveToBackend()">💾 保存课表</button>
      <button class="btn btn-outline" onclick="exitServer()">✕ 退出编辑器</button>
    </div>
  </header>

  <!-- 基础配置 -->
  <div class="card">
    <div class="config-bar">
      <div class="config-item">
        <label for="week1-monday">第一教学周周一：</label>
        <input type="date" id="week1-monday" value="2026-08-31">
      </div>
      <div class="config-item">
        <label for="total-weeks">学期总周数：</label>
        <input type="number" id="total-weeks" value="16" min="1" max="53" style="width: 70px;" onchange="onTotalWeeksChange()" oninput="onTotalWeeksChange()">
      </div>
      <div class="config-item" style="margin-left: auto;">
        <label for="filter-week">🔍 按周过滤预览：</label>
        <select id="filter-week" onchange="renderGrid()" style="padding:6px 10px; border:1px solid var(--border); border-radius:6px;">
          <option value="0">全部周次（综合视图）</option>
        </select>
      </div>
    </div>

    <!-- 画笔周次模式 -->
    <div class="mode-bar">
      <span class="title">当前设置周次模式：</span>
      <button class="mode-btn active" data-mode="every" onclick="setMode('every')">每周 (全部周次)</button>
      <button class="mode-btn" data-mode="odd" onclick="setMode('odd')">单周 (奇数周)</button>
      <button class="mode-btn" data-mode="even" onclick="setMode('even')">双周 (偶数周)</button>
      <button class="mode-btn" data-mode="custom" onclick="setMode('custom')">自定义周次 ⚙️</button>
      <span style="font-size:12px; color:var(--text-muted); margin-left:auto;">💡 切换模式不会影响已标记的格子，只对后续点击生效。</span>
    </div>

    <!-- 自定义周次选择抽屉 -->
    <div class="custom-weeks-drawer" id="custom-drawer">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:13px; font-weight:600;">勾选自定义周次：</span>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-outline" style="padding:2px 8px; font-size:12px;" onclick="quickSelectWeeks('1-8')">前8周</button>
          <button class="btn btn-outline" style="padding:2px 8px; font-size:12px;" onclick="quickSelectWeeks('9-16')">后8周</button>
          <button class="btn btn-outline" style="padding:2px 8px; font-size:12px;" onclick="quickSelectWeeks('all')">全选</button>
          <button class="btn btn-outline" style="padding:2px 8px; font-size:12px;" onclick="quickSelectWeeks('none')">全清</button>
        </div>
      </div>
      <div class="weeks-checkboxes" id="weeks-checkboxes"></div>
    </div>
  </div>

  <!-- 网格表格 -->
  <div class="table-container">
    <table id="timetable-table">
      <thead>
        <tr>
          <th class="time-col">时间段</th>
          <th>周一</th>
          <th>周二</th>
          <th>周三</th>
          <th>周四</th>
          <th>周五</th>
          <th>周六</th>
          <th>周日</th>
        </tr>
      </thead>
      <tbody id="grid-body">
        <!-- JS 动态渲染 -->
      </tbody>
    </table>
  </div>

  <div class="table-actions">
    <button class="btn btn-outline" onclick="addTimeSlotRow()">+ 添加新时间段</button>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-outline" onclick="resetDefaultTimeSlots()">恢复默认作息时间</button>
      <button class="btn btn-danger-outline" onclick="clearAllBusy()">清空全部有课标记</button>
    </div>
  </div>

  <div class="footer-bar">
    <div class="summary-text" id="summary-text">
      已标记 <strong>0</strong> 个时间占用记录
    </div>
    <div style="display:flex; gap:12px;">
      <button class="btn btn-primary" onclick="saveToBackend()" style="padding:10px 24px; font-size:15px;">💾 确认并保存课表</button>
      <button class="btn btn-outline" onclick="exitServer()">完成退出</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  // 获取 URL 参数中的 token
  const urlParams = new URLSearchParams(window.location.search);
  const sessionToken = urlParams.get('token') || '';

  // 默认高校常见节次时间段
  const DEFAULT_TIMES = [
    { start: '08:00', end: '09:35', label: '第1-2节' },
    { start: '09:55', end: '11:30', label: '第3-4节' },
    { start: '11:35', end: '12:20', label: '第5节' },
    { start: '14:00', end: '15:35', label: '第6-7节' },
    { start: '15:55', end: '17:30', label: '第8-9节' },
    { start: '19:00', end: '20:35', label: '第10-11节' }
  ];

  // 状态
  let timeSlots = JSON.parse(JSON.stringify(DEFAULT_TIMES));
  // busyMap: key = `${timeIndex}_${weekday}` -> { busy: bool, mode: 'every'|'odd'|'even'|'custom', weeks: [[a,b]] }
  let busyMap = {};
  let currentMode = 'every';
  let customSelectedWeeks = [1, 2, 3, 4, 5, 6, 7, 8];

  function showToast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.innerText = msg;
    el.className = `show ${type}`;
    setTimeout(() => { el.className = ''; }, 3000);
  }

  function onTotalWeeksChange() {
    const totalInput = document.getElementById('total-weeks');
    let totalWeeks = parseInt(totalInput.value) || 16;
    if (totalWeeks < 1) totalWeeks = 1;
    if (totalWeeks > 53) totalWeeks = 53;
    totalInput.value = totalWeeks;
    initWeeksFilter(totalWeeks);
    renderCustomWeeksCheckboxes(totalWeeks);
    renderGrid();
  }

  function initWeeksFilter(totalWeeks) {
    const sel = document.getElementById('filter-week');
    const prevVal = parseInt(sel.value) || 0;
    sel.innerHTML = '<option value="0">全部周次（综合视图）</option>';
    for (let w = 1; w <= totalWeeks; w++) {
      const opt = document.createElement('option');
      opt.value = w;
      opt.innerText = `第 ${w} 周视图`;
      if (w === prevVal) opt.selected = true;
      sel.appendChild(opt);
    }
  }

  function renderCustomWeeksCheckboxes(totalWeeks) {
    const box = document.getElementById('weeks-checkboxes');
    box.innerHTML = '';
    for (let w = 1; w <= totalWeeks; w++) {
      const label = document.createElement('label');
      label.className = 'week-check-label';
      const chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.value = w;
      chk.checked = customSelectedWeeks.includes(w);
      chk.onchange = () => {
        if (chk.checked) {
          if (!customSelectedWeeks.includes(w)) customSelectedWeeks.push(w);
        } else {
          customSelectedWeeks = customSelectedWeeks.filter(x => x !== w);
        }
        customSelectedWeeks.sort((a,b) => a - b);
      };
      label.appendChild(chk);
      label.appendChild(document.createTextNode(`第${w}周`));
      box.appendChild(label);
    }
  }

  function quickSelectWeeks(type) {
    const total = parseInt(document.getElementById('total-weeks').value) || 16;
    if (type === '1-8') customSelectedWeeks = Array.from({length: Math.min(8, total)}, (_, i) => i + 1);
    else if (type === '9-16') customSelectedWeeks = Array.from({length: total - 8}, (_, i) => i + 9);
    else if (type === 'all') customSelectedWeeks = Array.from({length: total}, (_, i) => i + 1);
    else if (type === 'none') customSelectedWeeks = [];
    renderCustomWeeksCheckboxes(total);
  }

  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    const drawer = document.getElementById('custom-drawer');
    drawer.classList.toggle('open', mode === 'custom');
  }

  function getWeeksForMode(mode, totalWeeks) {
    if (mode === 'every') return [[1, totalWeeks]];
    if (mode === 'odd') {
      const res = [];
      for (let w = 1; w <= totalWeeks; w += 2) res.push([w, w]);
      return res;
    }
    if (mode === 'even') {
      const res = [];
      for (let w = 2; w <= totalWeeks; w += 2) res.push([w, w]);
      return res;
    }
    if (mode === 'custom') {
      if (customSelectedWeeks.length === 0) return [[1, totalWeeks]];
      // 合并连续周次
      const sorted = [...customSelectedWeeks].sort((a,b) => a - b);
      const res = [];
      for (let n of sorted) {
        if (res.length > 0 && n === res[res.length - 1][1] + 1) {
          res[res.length - 1][1] = n;
        } else {
          res.push([n, n]);
        }
      }
      return res;
    }
    return [[1, totalWeeks]];
  }

  function isWeekActive(weeks, targetWeek) {
    if (!targetWeek || targetWeek === 0) return true;
    return weeks.some(([a, b]) => a <= targetWeek && targetWeek <= b);
  }

  function getBadgeHtml(mode, weeks) {
    if (mode === 'every') return '<span class="cell-badge badge-every">每周</span>';
    if (mode === 'odd') return '<span class="cell-badge badge-odd">单周</span>';
    if (mode === 'even') return '<span class="cell-badge badge-even">双周</span>';
    const txt = weeks.map(([a, b]) => a === b ? `${a}` : `${a}-${b}`).join(',') + '周';
    return `<span class="cell-badge badge-custom">${txt}</span>`;
  }

  function renderGrid() {
    const tbody = document.getElementById('grid-body');
    tbody.innerHTML = '';
    const filterW = parseInt(document.getElementById('filter-week').value) || 0;
    const totalWeeks = parseInt(document.getElementById('total-weeks').value) || 16;

    let totalBusy = 0;

    timeSlots.forEach((slot, rowIdx) => {
      const tr = document.createElement('tr');

      // 时间列
      const tdTime = document.createElement('td');
      tdTime.className = 'time-col';
      tdTime.innerHTML = `
        <div class="time-slot-inputs">
          <input type="time" value="${slot.start}" onchange="updateSlotTime(${rowIdx}, 'start', this.value)">
          <span>~</span>
          <input type="time" value="${slot.end}" onchange="updateSlotTime(${rowIdx}, 'end', this.value)">
          <button class="btn-del-row" title="删除此时段" onclick="deleteTimeSlotRow(${rowIdx})">✕</button>
        </div>
      `;
      tr.appendChild(tdTime);

      // 周一至周日 (weekday 1~7)
      for (let wd = 1; wd <= 7; wd++) {
        const td = document.createElement('td');
        const key = `${rowIdx}_${wd}`;
        const cellData = busyMap[key];
        const isBusy = cellData && cellData.busy;

        td.className = 'grid-cell';
        if (isBusy) {
          totalBusy++;
          td.classList.add('busy');
          const activeInFilter = isWeekActive(cellData.weeks, filterW);
          if (!activeInFilter && filterW > 0) {
            td.classList.add('dimmed');
          }
          td.innerHTML = `
            <div class="cell-content">
              <strong>有课</strong>
              ${getBadgeHtml(cellData.mode, cellData.weeks)}
            </div>
          `;
        } else {
          td.innerHTML = `<div class="cell-content"><span style="color:#cbd5e1;">-</span></div>`;
        }

        td.onclick = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
          toggleCell(rowIdx, wd);
        };

        tr.appendChild(td);
      }

      tbody.appendChild(tr);
    });

    document.getElementById('summary-text').innerHTML = `已标记 <strong>${totalBusy}</strong> 个时间占用记录`;
  }

  function toggleCell(rowIdx, wd) {
    const key = `${rowIdx}_${wd}`;
    const totalWeeks = parseInt(document.getElementById('total-weeks').value) || 16;

    if (busyMap[key] && busyMap[key].busy) {
      delete busyMap[key];
    } else {
      const weeks = getWeeksForMode(currentMode, totalWeeks);
      busyMap[key] = {
        busy: true,
        mode: currentMode,
        weeks: weeks
      };
    }
    renderGrid();
  }

  function updateSlotTime(rowIdx, field, val) {
    timeSlots[rowIdx][field] = val;
  }

  function addTimeSlotRow() {
    timeSlots.push({ start: '18:00', end: '19:35', label: '新时段' });
    renderGrid();
  }

  function deleteTimeSlotRow(rowIdx) {
    if (timeSlots.length <= 1) {
      alert('至少保留一个时间段');
      return;
    }
    timeSlots.splice(rowIdx, 1);
    // 重建 busyMap key
    const newBusyMap = {};
    Object.keys(busyMap).forEach(k => {
      const [rStr, wStr] = k.split('_');
      const r = parseInt(rStr);
      if (r < rowIdx) newBusyMap[`${r}_${wStr}`] = busyMap[k];
      else if (r > rowIdx) newBusyMap[`${r - 1}_${wStr}`] = busyMap[k];
    });
    busyMap = newBusyMap;
    renderGrid();
  }

  function resetDefaultTimeSlots() {
    if (!confirm('确定恢复默认常见节次时间段吗？当前时间轴将重置。')) return;
    timeSlots = JSON.parse(JSON.stringify(DEFAULT_TIMES));
    busyMap = {};
    renderGrid();
  }

  function clearAllBusy() {
    if (!confirm('确定清空所有已勾选的有课标记吗？')) return;
    busyMap = {};
    renderGrid();
  }

  // 后端交互
  async function loadFromBackend() {
    try {
      const res = await fetch(`/api/load?token=${sessionToken}`);
      const data = await res.json();
      if (data.week1_monday) {
        document.getElementById('week1-monday').value = data.week1_monday;
      }
      if (data.total_weeks) {
        const tw = parseInt(data.total_weeks) || 16;
        document.getElementById('total-weeks').value = tw;
        initWeeksFilter(tw);
        renderCustomWeeksCheckboxes(tw);
      }

      // 如果有已保存的 busy_slots
      if (Array.isArray(data.busy_slots) && data.busy_slots.length > 0) {
        // 提取所有唯一的时间段
        const uniqueTimes = [];
        data.busy_slots.forEach(s => {
          if (!uniqueTimes.some(t => t.start === s.start && t.end === s.end)) {
            uniqueTimes.push({ start: s.start, end: s.end });
          }
        });
        uniqueTimes.sort((a,b) => a.start.localeCompare(b.start));
        if (uniqueTimes.length > 0) {
          timeSlots = uniqueTimes;
        }

        busyMap = {};
        const totalWeeks = parseInt(document.getElementById('total-weeks').value) || 16;
        data.busy_slots.forEach(s => {
          const rowIdx = timeSlots.findIndex(t => t.start === s.start && t.end === s.end);
          if (rowIdx >= 0) {
            const key = `${rowIdx}_${s.weekday}`;
            // 判定模式
            let mode = 'custom';
            if (s.weeks.length === 1 && s.weeks[0][0] === 1 && s.weeks[0][1] >= totalWeeks) {
              mode = 'every';
            }
            busyMap[key] = {
              busy: true,
              mode: mode,
              weeks: s.weeks
            };
          }
        });
      }
      renderGrid();
      showToast('课表数据已成功读取', 'success');
    } catch (e) {
      console.warn('读取本地课表失败:', e);
      renderGrid();
    }
  }

  async function saveToBackend() {
    // 构造 payload
    const w1 = document.getElementById('week1-monday').value;
    const totalWeeks = parseInt(document.getElementById('total-weeks').value) || 16;
    const busySlotsList = [];

    Object.keys(busyMap).forEach(key => {
      const item = busyMap[key];
      if (item && item.busy) {
        const [rStr, wStr] = key.split('_');
        const row = timeSlots[parseInt(rStr)];
        if (row) {
          busySlotsList.push({
            weekday: parseInt(wStr),
            start: row.start,
            end: row.end,
            weeks: item.weeks
          });
        }
      }
    });

    let hasExceededWeeks = false;
    let maxExceeded = 0;
    busySlotsList.forEach(s => {
      (s.weeks || []).forEach(([a, b]) => {
        if (b > totalWeeks) {
          hasExceededWeeks = true;
          if (b > maxExceeded) maxExceeded = b;
        }
      });
    });
    if (hasExceededWeeks) {
      if (!confirm(`提示：部分已标记时段的周次（最高第 ${maxExceeded} 周）超出了当前设置的总周数（${totalWeeks} 周）。\n确定仍保留这些周次数据并保存吗？`)) {
        return;
      }
    }

    const payload = {
      schema_version: 2,
      week1_monday: w1,
      total_weeks: totalWeeks,
      busy_slots: busySlotsList
    };

    try {
      const res = await fetch(`/api/save?token=${sessionToken}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const ret = await res.json();
      if (ret.success) {
        showToast(`课表保存成功！已更新 ${ret.count} 条时间占用记录`, 'success');
      } else {
        showToast(`保存失败: ${ret.error}`, 'error');
      }
    } catch (e) {
      showToast(`网络请求错误: ${e.message}`, 'error');
    }
  }

  async function exitServer() {
    if (confirm('确定完成编辑并退出服务器吗？未保存的更改将丢失。')) {
      try {
        await fetch(`/api/exit?token=${sessionToken}`, { method: 'POST' });
      } catch (e) {}
      window.close();
      document.body.innerHTML = '<div style="padding:40px; text-align:center;"><h2>已安全退出编辑器</h2><p>可以返回命令行继续使用抢课工具。</p></div>';
    }
  }

  // 初始化
  window.onload = () => {
    const totalWeeks = parseInt(document.getElementById('total-weeks').value) || 16;
    initWeeksFilter(totalWeeks);
    renderCustomWeeksCheckboxes(totalWeeks);
    loadFromBackend();
  };
</script>

</body>
</html>
